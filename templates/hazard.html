<!DOCTYPE html>
<html>

<head>

<title>Hazard Detection</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

<a href="/">Home</a>
<a href="/dashboard">Routes</a>
<a href="/hazard">Hazard Detection</a>

</div>

<div class="page-shell">

<div class="panel">
<h2>Upload Road Video</h2>
<p class="helper-text">Upload a short road clip under 50 MB in mp4, mov, avi, mkv, webm, or m4v format.</p>

<form id="uploadForm">

<input type="file" name="video" accept="video/*" required>

<br><br>

<button id="analyzeButton" type="submit">Analyze</button>

</form>

<br>

<div id="result" class="status-box">Choose a video and click Analyze.</div>

</div>

</div>

<script>

var uploadForm = document.getElementById("uploadForm");
var result = document.getElementById("result");
var analyzeButton = document.getElementById("analyzeButton");
var pollHandle = null;

function showResult(message, state) {
result.className = "status-box " + state;
result.innerHTML = message;
}

function stopPolling() {
if (pollHandle) {
clearInterval(pollHandle);
pollHandle = null;
}
}

function cleanServerText(text) {
return text.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
}

async function readPayload(res) {
let text = await res.text();

if (!text) {
return {};
}

try {
return JSON.parse(text);
} catch (error) {
return {raw_text: cleanServerText(text)};
}
}

async function pollAnalysis(jobId) {
let res = await fetch("/analyze_video/" + jobId);
let data = await readPayload(res);

if (!res.ok) {
throw new Error(data.error || ("Could not read analysis status (" + res.status + ")."));
}

if (data.status === "processing") {
showResult(data.message || "Still analyzing your video...", "loading");
return;
}

stopPolling();

if (data.status === "completed" && data.result) {
showResult(
"Detected Vehicles: " + data.result.hazards +
"<br>Frames Analyzed: " + data.result.frames_analyzed +
"<br>Risk Score: " + data.result.risk_score +
"<br>Status: " + data.result.status,
"success"
);
return;
}

if (data.status === "failed") {
showResult(data.error || "Video analysis failed.", "error");
return;
}

showResult("The server returned an unknown analysis status.", "error");
}

uploadForm.onsubmit = async function(e){

e.preventDefault();
stopPolling();

let fileInput = this.querySelector('input[name="video"]');

if (!fileInput.files.length) {
showResult("Choose a video file before analyzing.", "error");
return;
}

let form = new FormData(this);

analyzeButton.disabled = true;
analyzeButton.textContent = "Analyzing...";
showResult("Uploading and analyzing your video. This can take a little while for larger clips.", "loading");

try {
let res = await fetch("/analyze_video",{
method:"POST",
body:form
});

let data = await readPayload(res);

if (!res.ok) {
if (data.raw_text) {
throw new Error("Request failed (" + res.status + "). " + data.raw_text);
}

throw new Error(data.error || ("Video analysis failed (" + res.status + ")."));
}

if (data.job_id) {
showResult(data.message || "Upload complete. Analysis started.", "loading");
pollHandle = setInterval(function(){
pollAnalysis(data.job_id).catch(function(error){
stopPolling();
showResult(error.message, "error");
});
}, 2000);
await pollAnalysis(data.job_id);
return;
}

if (typeof data.hazards !== "undefined") {
showResult(
"Detected Vehicles: " + data.hazards +
"<br>Frames Analyzed: " + data.frames_analyzed +
"<br>Risk Score: " + data.risk_score +
"<br>Status: " + data.status,
"success"
);
return;
}

throw new Error("The server did not return a usable analysis result.");
} catch (error) {
showResult(error.message, "error");
} finally {
analyzeButton.disabled = false;
analyzeButton.textContent = "Analyze";
}

}

</script>

</body>
</html>
