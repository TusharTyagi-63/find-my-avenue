<!DOCTYPE html>
<html>

<head>
<title>Hazard Detection</title>

<style>

body{
font-family:Arial;
background:#0b1a2f;
color:white;
text-align:center;
}

.navbar{
background:#16273f;
padding:10px;
}

.navbar a{
color:#8fd0ff;
text-decoration:none;
font-weight:bold;
margin-right:20px;
}

.container{
margin-top:40px;
}

button{
padding:10px 20px;
background:#2e6bff;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

input{
padding:10px;
}

</style>

</head>

<body>

<div class="navbar">

<a href="/">Routes</a>
<a href="/hazard">Hazard Detection</a>

</div>


<div class="container">

<h2>Upload Road Video</h2>

<form id="uploadForm">

<input type="file" name="video" required>

<br><br>

<button type="submit">Analyze</button>

</form>

<br>

<div id="result"></div>

</div>

<script>

document.getElementById("uploadForm").onsubmit = async function(e){

e.preventDefault();

let form=new FormData(this);

let res = await fetch("/analyze_video",{
method:"POST",
body:form
});

let data = await res.json();

document.getElementById("result").innerHTML =
"Detected Hazards: "+data.hazards+
"<br>Risk Score: "+data.risk_score+
"<br>Status: "+data.status;

}

</script>

</body>
</html>
