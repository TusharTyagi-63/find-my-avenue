<!DOCTYPE html>
<html>
<head>

<title>Find My Avenue</title>

<link rel="stylesheet" href="/static/style.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

<div class="navbar">

<a href="/">Routes</a>
<a href="/hazard">Hazard Detection</a>
<a href="/dashboard">Dashboard</a>

</div>

<div class="controls">

<input id="start" placeholder="lat,lon">

<input id="end" placeholder="destination">

<select id="mode">

<option value="driving-car">Driving</option>
<option value="cycling-regular">Cycling</option>
<option value="foot-walking">Walking</option>

</select>

<button onclick="findRoute()">Find Route</button>

<button onclick="toggleTraffic()">Traffic</button>

</div>

<div id="map"></div>

<script>

let map=L.map("map").setView([28.67,78.49],10)

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"OSM"
}
).addTo(map)

let routeLayers=[]

function clearRoutes(){

routeLayers.forEach(l=>map.removeLayer(l))
routeLayers=[]

}

async function findRoute(){

clearRoutes()

let start=document.getElementById("start").value
let end=document.getElementById("end").value
let mode=document.getElementById("mode").value

const res=await fetch("/route",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
start:start,
end:end,
mode:mode
})

})

const data=await res.json()

if(!data.routes){
alert("Route failed")
return
}

data.routes.forEach((route,i)=>{

let color="green"

if(i==1) color="blue"
if(i==2) color="gray"

let layer=L.geoJSON(route.geometry,{
style:{
color:color,
weight:6
}
}).addTo(map)

routeLayers.push(layer)

})

}

let trafficLayer=L.tileLayer(

"https://{s}.traffic.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key={{traffic_key}}",

{opacity:0.7}

)

function toggleTraffic(){

if(map.hasLayer(trafficLayer)){
map.removeLayer(trafficLayer)
}else{
map.addLayer(trafficLayer)
}

}

</script>

</body>
</html>
