<!DOCTYPE html>
<html>
<head>

<title>Find My Avenue Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<div class="navbar">

<a href="/">Home</a>
<a href="/dashboard">Routes</a>
<a href="/hazard">Hazard Detection</a>

<input id="start" placeholder="Start">
<input id="end" placeholder="End">

<button onclick="getLocation()">My Location</button>
<button onclick="getRoute()">Get Route</button>
<button id="trafficButton" type="button" onclick="toggleTraffic()">Show Traffic</button>

</div>

<div id="summaryBar">Routes now combine live traffic viewing with saved road hazard reports from analyzed clips.</div>
<div id="trafficLegend" class="traffic-legend hidden">
<span class="legend-pill green">Green</span>
<span class="legend-pill amber">Amber</span>
<span class="legend-pill red">Red</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([28.6,77.2],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
map.createPane('trafficPane');
map.getPane('trafficPane').style.zIndex = 430;
map.getPane('trafficPane').style.pointerEvents = 'none';
map.getPane('trafficPane').style.filter = 'saturate(2.2) contrast(1.3) brightness(1.04)';

var lines = [];
var hazardMarkers = [];
var trafficLayer = L.tileLayer('/api/traffic/tile/{z}/{x}/{y}.png', {
pane: 'trafficPane',
opacity: 0.98,
attribution: 'Traffic \u00a9 TomTom'
});
var trafficVisible = false;
var startMarker = null;

function buildRouteStyle(route, index) {

let dashArray = null;

if (route.route_rank === 2) {
dashArray = "10 10";
} else if (route.route_rank === 3) {
dashArray = "5 10";
}

return {
color: trafficVisible ? (route.recommended ? "#0f172a" : "#334155") : route.color,
weight: route.recommended ? (trafficVisible ? 4 : 7) : (trafficVisible ? 3 : 5),
opacity: route.recommended ? (trafficVisible ? 0.4 : 0.95) : (trafficVisible ? 0.18 : 0.82),
dashArray: dashArray
};

}


function refreshRouteStyles() {

lines.forEach(function(line) {
line.setStyle(buildRouteStyle(line.routeData));
});

}


function getSeverityColor(severity) {
if (severity === "high") {
return "#ef4444";
}

if (severity === "medium") {
return "#f59e0b";
}

return "#22c55e";
}


function clearHazards() {
hazardMarkers.forEach(function(marker) {
map.removeLayer(marker);
});

hazardMarkers = [];
}


function renderHazards(hazards) {
clearHazards();

hazards.forEach(function(hazard) {
let marker = L.circleMarker([hazard.latitude, hazard.longitude], {
radius: hazard.severity === "high" ? 8 : hazard.severity === "medium" ? 7 : 6,
color: getSeverityColor(hazard.severity),
fillColor: getSeverityColor(hazard.severity),
fillOpacity: 0.85,
weight: 2
}).addTo(map);

marker.bindPopup(
"<strong>" + hazard.location_label + "</strong><br>" +
"Source: " + (hazard.source_location || hazard.location_label) + "<br>" +
"Hazard: " + hazard.hazard_type + "<br>" +
"Severity: " + hazard.severity + "<br>" +
"Risk Score: " + hazard.risk_score + "<br>" +
"Detections: " + hazard.hazard_count
);

hazardMarkers.push(marker);
});
}


async function loadHazards() {

try {
let res = await fetch("/api/hazards?limit=100");
let data = await res.json();

if (!res.ok) {
return;
}

renderHazards(data.hazards || []);
} catch (error) {
}

}


function getLocation() {

if (!navigator.geolocation) {
document.getElementById("summaryBar").innerHTML = "Geolocation is not supported in this browser.";
return;
}

navigator.geolocation.getCurrentPosition(function(pos) {

var lat = pos.coords.latitude;
var lon = pos.coords.longitude;

document.getElementById("start").value = lat + "," + lon;

map.setView([lat,lon],12);

if (startMarker) {
map.removeLayer(startMarker);
}

startMarker = L.marker([lat,lon]).addTo(map);

}, function() {
document.getElementById("summaryBar").innerHTML = "Could not fetch your current location.";
});
}


function toggleTraffic() {

let button = document.getElementById("trafficButton");
let legend = document.getElementById("trafficLegend");

if (trafficVisible) {
map.removeLayer(trafficLayer);
button.textContent = "Show Traffic";
legend.classList.add("hidden");
document.getElementById("summaryBar").innerHTML = "Traffic overlay hidden. Hazard markers and safety-ranked routes remain visible.";
trafficVisible = false;
refreshRouteStyles();
return;
}

trafficLayer.addTo(map);
button.textContent = "Hide Traffic";
legend.classList.remove("hidden");
document.getElementById("summaryBar").innerHTML = "Traffic overlay is live with stronger contrast. Red roads show the heaviest congestion, amber is moderate, and green is moving well.";
trafficVisible = true;
refreshRouteStyles();

}


async function getRoute() {

let start = document.getElementById("start").value;
let end = document.getElementById("end").value;
let summaryBar = document.getElementById("summaryBar");

if (!start || !end) {
summaryBar.innerHTML = "Enter both a start and an end location.";
return;
}

summaryBar.innerHTML = "Finding safer routes...";

try {
let res = await fetch("/api/route",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({start:start,end:end})
});

let data = {};

try {
data = await res.json();
} catch (error) {
data = {};
}

lines.forEach(function(line) {
map.removeLayer(line);
});
lines = [];

if (!res.ok) {
summaryBar.innerHTML = data.error || "Could not load routes right now.";
return;
}

let summary = [];
let recommendedLine = null;

data.routes.forEach(function(route, index) {

let poly = L.polyline(route.coords, buildRouteStyle(route, index)).addTo(map);
poly.routeData = route;

if (route.recommended) {
recommendedLine = poly;
}

lines.push(poly);

let lead = route.recommended ? "Recommended Route " : "Route ";
summary.push(
lead + (index + 1) +
" -> Distance " + route.distance + " km" +
" | Duration " + route.duration + " min" +
" | Safety " + route.safety_score +
" | Nearby Hazards " + route.hazard_count +
" | " + route.safety_label
);

});

if (recommendedLine) {
map.fitBounds(recommendedLine.getBounds(), {padding:[20,20]});
} else if (lines.length) {
map.fitBounds(lines[0].getBounds(), {padding:[20,20]});
}

if (summary.length) {
summaryBar.innerHTML = summary.join("<br>");
} else {
summaryBar.innerHTML = "No routes were returned for this trip.";
}

loadHazards();
} catch (error) {
summaryBar.innerHTML = "Could not load routes right now.";
}

}


loadHazards();

</script>

</body>
</html>
