<!DOCTYPE html>
<html>
<head>

<title>Find My Avenue Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<div class="navbar">

<a href="/">Home</a>
<a href="/dashboard">Routes</a>
<a href="/hazard">Hazard Detection</a>

<input id="start" placeholder="Start">
<input id="end" placeholder="End">

<button onclick="getLocation()">My Location</button>
<button onclick="getRoute()">Get Route</button>
<button id="trafficButton" type="button" onclick="toggleTraffic()">Show Traffic</button>

</div>

<div id="summaryBar">Turn on Traffic to color the live road network on the map.</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([28.6,77.2],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var lines = [];
var trafficLayer = L.tileLayer('/api/traffic/tile/{z}/{x}/{y}.png', {
opacity: 0.9,
attribution: 'Traffic \u00a9 TomTom'
});
var trafficVisible = false;
var startMarker = null;

function getLocation(){

if (!navigator.geolocation) {
document.getElementById("summaryBar").innerHTML = "Geolocation is not supported in this browser.";
return;
}

navigator.geolocation.getCurrentPosition(function(pos){

var lat = pos.coords.latitude;
var lon = pos.coords.longitude;

document.getElementById("start").value = lat + "," + lon;

map.setView([lat,lon],12);

if (startMarker) {
map.removeLayer(startMarker);
}

startMarker = L.marker([lat,lon]).addTo(map);

}, function(){
document.getElementById("summaryBar").innerHTML = "Could not fetch your current location.";
});
}


function toggleTraffic(){

let button = document.getElementById("trafficButton");

if (trafficVisible) {
map.removeLayer(trafficLayer);
button.textContent = "Show Traffic";
document.getElementById("summaryBar").innerHTML = "Traffic overlay hidden. Click Show Traffic to color the live road network.";
trafficVisible = false;
return;
}

trafficLayer.addTo(map);
button.textContent = "Hide Traffic";
document.getElementById("summaryBar").innerHTML = "Traffic overlay is live. Green roads are moving well and red roads are slower.";
trafficVisible = true;

}


async function getRoute(){

let start = document.getElementById("start").value;
let end = document.getElementById("end").value;
let summaryBar = document.getElementById("summaryBar");

if (!start || !end) {
summaryBar.innerHTML = "Enter both a start and an end location.";
return;
}

summaryBar.innerHTML = "Finding routes...";

try {
let res = await fetch("/api/route",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({start:start,end:end})
});

let data = {};

try {
data = await res.json();
} catch (error) {
data = {};
}

lines.forEach(function(line){
map.removeLayer(line);
});
lines = [];

if (!res.ok) {
summaryBar.innerHTML = data.error || "Could not load routes right now.";
return;
}

let summary = [];

data.routes.forEach(function(route, index){

let poly = L.polyline(route.coords,{
color:route.color,
weight:6,
opacity:0.9
}).addTo(map);

lines.push(poly);

summary.push("Route " + (index + 1) + " -> Distance " + route.distance + " km | Duration " + route.duration + " min");

});

if (lines.length) {
map.fitBounds(lines[0].getBounds());
summaryBar.innerHTML = summary.join("<br>");
} else {
summaryBar.innerHTML = "No routes were returned for this trip.";
}
} catch (error) {
summaryBar.innerHTML = "Could not load routes right now.";
}

}

</script>

</body>
</html>
