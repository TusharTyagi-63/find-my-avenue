<!DOCTYPE html>
<html>
<head>

<title>Find My Avenue Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<div class="navbar">

<a href="/">Home</a>
<a href="/dashboard">Routes</a>
<a href="/hazard">Hazard Detection</a>
<a href="/emergency">Emergency Module</a>

<input id="start" list="startSuggestions" placeholder="Start: city, college, hospital, landmark">
<datalist id="startSuggestions"></datalist>
<input id="end" list="endSuggestions" placeholder="Destination: city, college, hospital, landmark">
<datalist id="endSuggestions"></datalist>

<div class="mode-picker" id="modePicker">
<button id="modeMenuButton" type="button" class="mode-menu-button" onclick="toggleModeMenu(event)">Mode: Drive</button>
<div id="modeMenu" class="mode-menu hidden">
<button type="button" class="mode-menu-item active" data-mode-option="drive" onclick="selectPrimaryMode('drive')">Drive</button>
<button type="button" class="mode-menu-item has-children" data-mode-option="ride" onclick="toggleRideMenu(event)">
<span>Ride</span>
<span id="rideMenuCaret" class="menu-caret">›</span>
</button>
<div id="rideSubmenu" class="mode-submenu hidden">
<button type="button" class="mode-submenu-item active" data-ride-mode="bike" onclick="selectRideVariant('bike')">Bike</button>
<button type="button" class="mode-submenu-item" data-ride-mode="bicycle" onclick="selectRideVariant('bicycle')">Bicycle</button>
</div>
<button type="button" class="mode-menu-item" data-mode-option="walk" onclick="selectPrimaryMode('walk')">Walk</button>
</div>
</div>

<button onclick="getLocation()">My Location</button>
<button onclick="getRoute()">Get Route</button>
<button id="trafficButton" type="button" onclick="toggleTraffic()">Show Traffic</button>

</div>

<div id="summaryBar">Search by city, college, hospital, or landmark. Routes combine live traffic viewing with saved road hazard reports from analyzed clips.</div>
<div id="trafficLegend" class="traffic-legend hidden">
<span class="legend-pill green">Green</span>
<span class="legend-pill amber">Amber</span>
<span class="legend-pill red">Red</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([28.6,77.2],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
map.createPane('trafficPane');
map.getPane('trafficPane').style.zIndex = 430;
map.getPane('trafficPane').style.pointerEvents = 'none';
map.getPane('trafficPane').style.filter = 'saturate(2.2) contrast(1.3) brightness(1.04)';

var lines = [];
var hazardMarkers = [];
var trafficLayer = L.tileLayer('/api/traffic/tile/{z}/{x}/{y}.png', {
pane: 'trafficPane',
opacity: 0.98,
attribution: 'Traffic \u00a9 TomTom'
});
var trafficVisible = false;
var startMarker = null;
var selectedMode = "drive";
var selectedPrimaryMode = "drive";
var selectedRideMode = "bike";
var locationSuggestionCache = {};
var selectedLocations = {
start: null,
end: null
};
var routeModeLabels = {
drive: "Drive",
bike: "Bike",
bicycle: "Bicycle",
walk: "Walk"
};

function buildRouteStyle(route, index) {

let dashArray = null;

if (route.route_rank === 2) {
dashArray = "10 10";
} else if (route.route_rank === 3) {
dashArray = "5 10";
}

return {
color: trafficVisible ? (route.recommended ? "#0f172a" : "#334155") : route.color,
weight: route.recommended ? (trafficVisible ? 4 : 7) : (trafficVisible ? 3 : 5),
opacity: route.recommended ? (trafficVisible ? 0.4 : 0.95) : (trafficVisible ? 0.18 : 0.82),
dashArray: dashArray
};

}


function refreshRouteStyles() {

lines.forEach(function(line) {
line.setStyle(buildRouteStyle(line.routeData));
});

}


function getSeverityColor(severity) {
if (severity === "high") {
return "#ef4444";
}

if (severity === "medium") {
return "#f59e0b";
}

return "#22c55e";
}


function clearHazards() {
hazardMarkers.forEach(function(marker) {
map.removeLayer(marker);
});

hazardMarkers = [];
}


function renderHazards(hazards) {
clearHazards();

hazards.forEach(function(hazard) {
let marker = L.circleMarker([hazard.latitude, hazard.longitude], {
radius: hazard.severity === "high" ? 8 : hazard.severity === "medium" ? 7 : 6,
color: getSeverityColor(hazard.severity),
fillColor: getSeverityColor(hazard.severity),
fillOpacity: 0.85,
weight: 2
}).addTo(map);

marker.bindPopup(
"<strong>" + hazard.location_label + "</strong><br>" +
"Source: " + (hazard.source_location || hazard.location_label) + "<br>" +
"Hazard: " + hazard.hazard_type + "<br>" +
"Severity: " + hazard.severity + "<br>" +
"Risk Score: " + hazard.risk_score + "<br>" +
"Detections: " + hazard.hazard_count
);

hazardMarkers.push(marker);
});
}


async function loadHazards() {

try {
let res = await fetch("/api/hazards?limit=100");
let data = await res.json();

if (!res.ok) {
return;
}

renderHazards(data.hazards || []);
} catch (error) {
}

}


function updateLocationSuggestions(listId, suggestions) {
let datalist = document.getElementById(listId);
datalist.innerHTML = "";

suggestions.forEach(function(item) {
let option = document.createElement("option");
option.value = item.label;
option.label = item.label;
datalist.appendChild(option);
});
}


function getOppositeInputId(inputId) {
return inputId === "start" ? "end" : "start";
}


function getResolvedFocusValue(inputId) {
let oppositeId = getOppositeInputId(inputId);
let selected = selectedLocations[oppositeId];

if (selected) {
return selected.latitude + "," + selected.longitude;
}

let fallbackValue = document.getElementById(oppositeId).value.trim();

if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(fallbackValue)) {
return fallbackValue;
}

return "";
}


function syncSelectedLocation(inputId, suggestions) {
let currentValue = document.getElementById(inputId).value.trim().toLowerCase();
let match = suggestions.find(function(item) {
return item.label.toLowerCase() === currentValue;
});

selectedLocations[inputId] = match || null;
}


async function fetchLocationSuggestions(query, listId, inputId) {
let trimmedQuery = query.trim();

if (trimmedQuery.length < 3) {
updateLocationSuggestions(listId, []);
selectedLocations[inputId] = null;
return;
}

let focusValue = getResolvedFocusValue(inputId);
let cacheKey = trimmedQuery + "|" + focusValue;

if (locationSuggestionCache[cacheKey]) {
updateLocationSuggestions(listId, locationSuggestionCache[cacheKey]);
syncSelectedLocation(inputId, locationSuggestionCache[cacheKey]);
return;
}

try {
let url = "/api/location-search?q=" + encodeURIComponent(trimmedQuery) + "&limit=5";

if (focusValue) {
url += "&focus=" + encodeURIComponent(focusValue);
}

let res = await fetch(url);
let data = await res.json();

if (!res.ok) {
updateLocationSuggestions(listId, []);
selectedLocations[inputId] = null;
return;
}

let suggestions = data.suggestions || [];
locationSuggestionCache[cacheKey] = suggestions;
updateLocationSuggestions(listId, suggestions);
syncSelectedLocation(inputId, suggestions);
} catch (error) {
updateLocationSuggestions(listId, []);
selectedLocations[inputId] = null;
}
}


function attachLocationAutocomplete(inputId, listId) {
let input = document.getElementById(inputId);
let debounceHandle = null;

input.addEventListener("input", function() {
selectedLocations[inputId] = null;
clearTimeout(debounceHandle);
debounceHandle = setTimeout(function() {
fetchLocationSuggestions(input.value, listId, inputId);
}, 250);
});

input.addEventListener("focus", function() {
fetchLocationSuggestions(input.value, listId, inputId);
});

input.addEventListener("change", function() {
fetchLocationSuggestions(input.value, listId, inputId);
});
}


function getResolvedLocationValue(inputId) {
let selected = selectedLocations[inputId];

if (selected) {
return selected.latitude + "," + selected.longitude;
}

return document.getElementById(inputId).value.trim();
}


function formatDurationMinutes(totalMinutes) {
let roundedMinutes = Math.max(1, Math.round(Number(totalMinutes) || 0));
let days = Math.floor(roundedMinutes / 1440);
let remainingMinutes = roundedMinutes % 1440;
let hours = Math.floor(remainingMinutes / 60);
let minutes = remainingMinutes % 60;
let parts = [];

if (days) {
parts.push(days + (days === 1 ? " day" : " days"));
}

if (hours) {
parts.push(hours + " hr");
}

if (minutes || !parts.length) {
parts.push(minutes + " min");
}

return parts.join(" ");
}


function getLocation() {

if (!navigator.geolocation) {
document.getElementById("summaryBar").innerHTML = "Geolocation is not supported in this browser.";
return;
}

navigator.geolocation.getCurrentPosition(function(pos) {

var lat = pos.coords.latitude;
var lon = pos.coords.longitude;

document.getElementById("start").value = lat + "," + lon;
selectedLocations.start = {
label: "Current location",
latitude: lat,
longitude: lon
};

map.setView([lat,lon],12);

if (startMarker) {
map.removeLayer(startMarker);
}

startMarker = L.marker([lat,lon]).addTo(map);

}, function() {
document.getElementById("summaryBar").innerHTML = "Could not fetch your current location.";
});
}


function getSelectedModeLabel() {
return routeModeLabels[selectedMode] || "Drive";
}


function closeModeMenus() {
document.getElementById("modeMenu").classList.add("hidden");
document.getElementById("rideSubmenu").classList.add("hidden");
document.getElementById("rideMenuCaret").textContent = "›";
}


function syncModeControls() {
document.getElementById("modeMenuButton").textContent = "Mode: " + getSelectedModeLabel();

document.querySelectorAll(".mode-menu-item[data-mode-option]").forEach(function(button) {
let mode = button.dataset.modeOption;
let isActive = mode === "ride" ? selectedPrimaryMode === "ride" : selectedPrimaryMode === mode;
button.classList.toggle("active", isActive);
});

document.querySelectorAll(".mode-submenu-item").forEach(function(button) {
button.classList.toggle("active", button.dataset.rideMode === selectedRideMode);
});
}


function toggleModeMenu(event) {
event.stopPropagation();
let modeMenu = document.getElementById("modeMenu");
let shouldOpen = modeMenu.classList.contains("hidden");
closeModeMenus();

if (shouldOpen) {
modeMenu.classList.remove("hidden");
}
}


function toggleRideMenu(event) {
event.stopPropagation();
let modeMenu = document.getElementById("modeMenu");
let rideSubmenu = document.getElementById("rideSubmenu");
let rideMenuCaret = document.getElementById("rideMenuCaret");

if (modeMenu.classList.contains("hidden")) {
modeMenu.classList.remove("hidden");
}

let shouldOpen = rideSubmenu.classList.contains("hidden");
rideSubmenu.classList.toggle("hidden", !shouldOpen);
rideMenuCaret.textContent = shouldOpen ? "▾" : "›";
}


function selectPrimaryMode(mode) {
selectedPrimaryMode = mode;
selectedMode = mode;
syncModeControls();
closeModeMenus();
}


function selectRideVariant(mode) {
selectedPrimaryMode = "ride";
selectedRideMode = mode;
selectedMode = mode;
syncModeControls();
closeModeMenus();
}


function toggleTraffic() {

let button = document.getElementById("trafficButton");
let legend = document.getElementById("trafficLegend");

if (trafficVisible) {
map.removeLayer(trafficLayer);
button.textContent = "Show Traffic";
legend.classList.add("hidden");
document.getElementById("summaryBar").innerHTML = "Traffic overlay hidden. Hazard markers and safety-ranked routes remain visible.";
trafficVisible = false;
refreshRouteStyles();
return;
}

trafficLayer.addTo(map);
button.textContent = "Hide Traffic";
legend.classList.remove("hidden");
document.getElementById("summaryBar").innerHTML = "Traffic overlay is live with stronger contrast. Red roads show the heaviest congestion, amber is moderate, and green is moving well.";
trafficVisible = true;
refreshRouteStyles();

}


async function getRoute() {

let start = document.getElementById("start").value;
let end = document.getElementById("end").value;
let summaryBar = document.getElementById("summaryBar");

if (!start || !end) {
summaryBar.innerHTML = "Enter both a start and an end location.";
return;
}

summaryBar.innerHTML = "Finding safer routes for " + (routeModeLabels[selectedMode] || "Drive").toLowerCase() + " mode...";

try {
let res = await fetch("/api/route",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
start:getResolvedLocationValue("start"),
end:getResolvedLocationValue("end"),
mode:selectedMode
})
});

let data = {};

try {
data = await res.json();
} catch (error) {
data = {};
}

lines.forEach(function(line) {
map.removeLayer(line);
});
lines = [];

if (!res.ok) {
summaryBar.innerHTML = data.error || "Could not load routes right now.";
return;
}

let summary = [];
let recommendedLine = null;
let modeLabel = data.mode_label || routeModeLabels[selectedMode] || "Drive";

data.routes.forEach(function(route, index) {

let poly = L.polyline(route.coords, buildRouteStyle(route, index)).addTo(map);
poly.routeData = route;

if (route.recommended) {
recommendedLine = poly;
}

lines.push(poly);

let lead = route.recommended ? "Recommended Route " : "Route ";
summary.push(
lead + (index + 1) +
" -> Distance " + route.distance + " km" +
" | Duration " + formatDurationMinutes(route.duration) +
" | Safety " + route.safety_score +
" | Nearby Hazards " + route.hazard_count +
" | Nearest " + (route.nearest_hazard_km == null ? "-" : (route.nearest_hazard_km + " km")) +
" | " + route.safety_label
);

});

if (recommendedLine) {
map.fitBounds(recommendedLine.getBounds(), {padding:[20,20]});
} else if (lines.length) {
map.fitBounds(lines[0].getBounds(), {padding:[20,20]});
}

if (summary.length) {
summaryBar.innerHTML = modeLabel + " mode routes:<br>" + summary.join("<br>");
} else {
summaryBar.innerHTML = "No routes were returned for this trip.";
}

loadHazards();
} catch (error) {
summaryBar.innerHTML = "Could not load routes right now.";
}

}


loadHazards();
attachLocationAutocomplete("start", "startSuggestions");
attachLocationAutocomplete("end", "endSuggestions");
syncModeControls();

document.addEventListener("click", function(event) {
if (!document.getElementById("modePicker").contains(event.target)) {
closeModeMenus();
}
});

</script>

</body>
</html>
