<!DOCTYPE html>
<html>
<head>

<title>Find My Avenue Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<div class="navbar">

<a href="/">Home</a>
<a href="/dashboard">Routes</a>
<a href="/hazard">Hazard Detection</a>

<input id="start" placeholder="Start">
<input id="end" placeholder="End">

<button onclick="getLocation()">My Location</button>
<button onclick="getRoute()">Get Route</button>
<button onclick="showTraffic()">Traffic Heatmap</button>

</div>

<div id="summaryBar"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>

var map = L.map('map').setView([28.6,77.2],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var lines=[];
var safestCoords=[];
var heatLayer=null;

function getLocation(){

navigator.geolocation.getCurrentPosition(function(pos){

var lat=pos.coords.latitude;
var lon=pos.coords.longitude;

document.getElementById("start").value = lat+","+lon;

map.setView([lat,lon],12);

L.marker([lat,lon]).addTo(map);

});
}


async function getRoute(){

let start=document.getElementById("start").value;
let end=document.getElementById("end").value;

let res = await fetch("/api/route",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({start:start,end:end})
});

let data = await res.json();

lines.forEach(l=>map.removeLayer(l));
lines=[];

let summary="";

data.routes.forEach((r,i)=>{

let color="red";

if(i===0){
color="lime";
safestCoords=r.coords;
}

if(i===1) color="yellow";

let poly=L.polyline(r.coords,{
color:color,
weight:6
}).addTo(map);

lines.push(poly);

summary += `Route ${i+1} → Distance ${r.distance} km | Duration ${r.duration} min | Traffic ${r.traffic}% | Risk Score ${r.risk}<br>`;

});

map.fitBounds(lines[0].getBounds());

document.getElementById("summaryBar").innerHTML = summary;

}


async function showTraffic(){

if(safestCoords.length===0){
alert("Generate route first");
return;
}

let res = await fetch("/api/traffic_heatmap",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({coords:safestCoords})
});

let data = await res.json();

if(heatLayer) map.removeLayer(heatLayer);

heatLayer=L.heatLayer(data.heat,{
radius:25,
blur:20,
maxZoom:10
}).addTo(map);

}

</script>

</body>
</html>
